      gsap.set(".rs-bar", { scaleX: 0 });

      // 1 · "the same team could serve 3.73 times as many people": the dots fill as the number counts, and both land on the spoken number
      const dots = Array.from(document.querySelectorAll("#rs-b .rs-db"));
      const num = document.getElementById("rs-num");
      const n = { v: 1 };
      const show = () => {
        num.textContent = n.v.toFixed(2) + "×";
        const c = n.v * 100;
        for (let i = 100; i < dots.length; i++) dots[i].style.opacity = String(0.12 + 0.88 * Math.min(1, Math.max(0, c - i)));
      };
      show();
      tl.to(n, { v: 3.73, duration: T.num + 0.05 - T.count0, ease: "power2.inOut", onUpdate: show }, T.count0);
      tl.fromTo("#rs-cap", { autoAlpha: 0, filter: "blur(4px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, T.cap);

      // 2 · "And they found disciple-making leaders at about the same rate": the number steps up to make room

      tl.fromTo("#rs-small", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.nudge + 0.6);
      tl.fromTo("#rs-ld1", { autoAlpha: 0, y: 64 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power4.out" }, T.leaders);
      tl.fromTo("#rs-ld2", { autoAlpha: 0, y: 64 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power4.out" }, T.leaders + 0.14);
