          const fs = bw * 0.2;
          const slots = [];
          for (let r = 0; r < 4; r++) for (let c = 0; c < 4 - r; c++) slots.push({ x: W / 2 + (c - (3 - r) / 2) * fs * 0.95, y: bcy - bh / 2 - fs * 0.25 - r * fs * 0.78 });
          beats.slice(0, slots.length).forEach((bt, i) => {
            const sl = slots[i], o = fruit(back, sl.x, sl.y, fs, i % 4 === 2 ? 0 : i % 4);
            const drop = sl.y - (b.top + b.h);
            gsap.set(o.wrap, { autoAlpha: 0 });
            tl.fromTo(o.wrap, { autoAlpha: 0, y: -drop }, { keyframes: [{ autoAlpha: 1, duration: 0.01 }, { y: 0, duration: 0.3, ease: "power2.in" }, { scaleY: 0.8, duration: 0.05 }, { scaleY: 1, duration: 0.12 }] }, bt - 0.3);
            exitWith(b, [o.wrap]);
          });
          [0, 1, 2, 3, 4, 5].forEach((i) => {
            const dir = i % 2 ? 1 : -1, o = fruit(front, W / 2, bcy - bh, fs * 0.9, i % 4);
            gsap.set(o.wrap, { autoAlpha: 0 });
            const t0 = gen.w.t + i * 0.07;
            K.drive((t) => {
              const q = t - t0;
              if (q < 0 || t > b.tout) { gsap.set(o.wrap, { autoAlpha: 0 }); return; }
              const x = dir * (bw * 0.3 + q * W * (0.18 + 0.05 * i)), y = -bh * 0.9 * Math.sin(Math.min(q * 4, Math.PI)) + Math.max(0, q - 0.78) * bh * 3;
              gsap.set(o.wrap, { autoAlpha: 1, x, y: Math.min(y, bh * 0.9), rotation: dir * q * 360 });
            });
          });
          shakes.push({ t: gen.w.t + 0.05, amp: 12, decay: 0.1 });
          exitWith(b, [bowl.wrap]);
        }

        // ── B4 "Righteous in everything, / Kind in everything," : a balance levels out, a heart lands in a pan ──
        {
          const b = blocks[4], rig = A(10, "righteous"), ev = L(10).w[2].t, kind = A(11, "kind").w.t;
          const ab = bandAbove(b), sh = Math.min((ab.y1 - ab.y0) * 0.92, 380 * u), sw2 = sh * 1.5;
          const bal = riso(front, W / 2, ab.y1 - sh / 2, sw2, sh, [300, 200], (g, p) => {
            path(g, "M150 40 L150 186 M110 192 H190", p, null, { "stroke-width": p.sw * 1.2 });
            path(g, "M120 192 L150 160 L180 192Z", p, p.f1);
            const beam = path(g, "M40 40 H260", p, null, { "stroke-width": p.sw * 1.3 });
            sv(g, "circle", { cx: 150, cy: 40, r: 11, fill: p.f1, stroke: p.line, "stroke-width": p.sw * 0.7 });
            const pan = (x, item) => {
              const gg = sv(g, "g", {});
              path(gg, `M${x} 0 L${x - 34} 60 M${x} 0 L${x + 34} 60`, p, null, { "stroke-width": p.sw * 0.6 });
              path(gg, `M${x - 44} 60 H${x + 44} Q${x} 98 ${x - 44} 60Z`, p, p.f4);
              const it = item(gg, x);
              return { gg, it, x };
            };
            const l = pan(40, (gg, x) => path(sv(gg, "g", {}), HEART, p, p.f5, { transform: `translate(${x - 21} 18) scale(0.42)`, "stroke-width": p.sw / 0.42 * 0.8 }));
            const r = pan(260, (gg, x) => path(gg, star5(x, 40, 22, 10), p, p.f1, { "stroke-width": p.sw * 0.8 }));
            return { beam, l, r };
          });
          pop(bal.wrap, rig.w.t - 0.05, { r0: 0, s0: 0.4 });
          bal.both((r) => { r.l.it = r.l.it.parentNode; gsap.set(r.l.it, { autoAlpha: 0 }); });
          bal.both((r) => tl.fromTo(r.l.it, { autoAlpha: 0, y: -60 }, { autoAlpha: 1, y: 0, duration: 0.2, ease: "power2.in" }, kind - 0.15));
          const ang = (t) => {
            let a = t < ev ? -16 : -16 * Math.exp(-(t - ev) / 0.18) * Math.cos((t - ev) * 12);
            if (t > kind + 0.05) a += 10 * Math.exp(-(t - kind - 0.05) / 0.25) * Math.cos((t - kind - 0.05) * 14);
            return a;
          };
          K.drive((t) => {
            const a = ang(t), rad = (a * Math.PI) / 180;
            bal.both((r) => {
              r.beam.setAttribute("transform", `rotate(${a.toFixed(2)} 150 40)`);
              [r.l, r.r].forEach((pn) => { const dx = 150 + (pn.x - 150) * Math.cos(rad) - pn.x, dy = (pn.x - 150) * Math.sin(rad); pn.gg.setAttribute("transform", `translate(${dx.toFixed(2)} ${(40 + dy).toFixed(2)})`); });
            });
          });
          // "everything": little things pop round the bottom of the frame
          const bb = bandBelow(b);
          const sets = [ev, L(11).w[2].t];
          sets.forEach((t0, si) => [0, 1, 2, 3, 4].forEach((i) => {
            const s = Math.min(80 * u, (bb.y1 - bb.y0) * 0.7), x = W * (0.12 + i * 0.19 + si * 0.09), y = bb.y0 + (bb.y1 - bb.y0) * (si ? 0.62 : 0.38);
            if (x > W - M) return;
            const o = i % 2 ? fruit(back, x, y, s, (i + si) % 4) : riso(back, x, y, s, s, [100, 100], (g, p) => { path(g, i ? star5(50, 54, 46, 20) : SPARK, p, si ? p.f2 : p.f1); }, { off: 4 });
            pop(o.wrap, t0 + i * 0.05, { s0: 0, r0: -60 });
            K.drive((t) => gsap.set(o.inner, { y: Math.sin(t * 7.33 + i) * 6 * u }));
            exitWith(b, [o.wrap]);
          }));
          exitWith(b, [bal.wrap]);
        }

        // ── B5 "Near to everyone who calls Your name. / Those who call sincerely," : ripples from "name" ──
        {
          const b = blocks[5], name = A(12, "name"), every = L(12).w[2].t;
          const ab = bandAbove(b), bb = bandBelow(b);
          // everyone, drawing near
          const heads = [];
          [ab, bb].forEach((bd, k) => [0, 1, 2, 3].forEach((i) => {
            const s = Math.min(110 * u, (bd.y1 - bd.y0) * 0.55), x = W * (0.14 + i * 0.24), y = k ? bd.y1 - s * 0.6 : bd.y0 + s * 0.6;
            const o = riso(front, x, y, s * 0.8, s, [80, 100], (g, p) => {
              sv(g, "circle", { cx: 40, cy: 26, r: 20, fill: [p.f1, p.f2, p.f4, p.f5][(i + k) % 4], stroke: p.line, "stroke-width": p.sw });
              path(g, "M8 98 Q8 52 40 52 Q72 52 72 98Z", p, [p.f2, p.f4, p.f5, p.f1][(i + k) % 4]);
            }, { off: 4 });
            pop(o.wrap, every + (i + k * 4) * 0.04, { s0: 0, r0: 0 });
            const toward = (k ? -1 : 1) * Math.max(0, (bd.y1 - bd.y0) - s * 1.3) * 0.5;
            K.drive((t) => gsap.set(o.inner, { y: toward * ease3((t - every) / 1.4) }));
            heads.push(o.wrap);
          }));
          const r0 = Math.max(name.box.w, name.box.h) * 0.62;
          const starts = [name.w.t, ...S.beats.filter((x) => x > name.w.t + 0.15 && x < b.tout - 0.4)];
          starts.forEach((t0, i) => {
            const o = riso(back, name.box.cx, name.box.cy, r0 * 2, r0 * 2, [100, 100], (g, p) => { sv(g, "circle", { cx: 50, cy: 50, r: 48, fill: "none", stroke: i % 2 ? (p.main ? C.yellow : p.line) : p.f2, "stroke-width": p.sw }); }, { sw: 7, off: 5 });
            gsap.set(o.wrap, { autoAlpha: 0 });
            tl.to(o.wrap, { keyframes: [{ autoAlpha: 0.9, scale: 1, duration: 0.01 }, { autoAlpha: 0, scale: 4.2, duration: 1.3, ease: "power1.out" }] }, t0);
          });
          shakes.push({ t: name.w.t + 0.05, amp: 9, decay: 0.1 });
          exitWith(b, heads);
        }

        // ── B6 "You are right there, / You fulfill their desire / And You hear their prayer." ──
        {
          const b = blocks[6], there = A(14, "there"), ful = L(15).w[1].t, des = A(15, "desire"), hear = A(16, "hear"), pr = A(16, "prayer");
          const bb = bandBelow(b), ab = bandAbove(b), ps = Math.min(200 * u, (bb.y1 - bb.y0) * 0.8);
          // "right there": a pin drops
          const pin = riso(front, W * (P ? 0.28 : 0.3), bb.y0 + ps / 2, ps * 0.72, ps, [72, 100], (g, p) => {
            path(g, "M36 96 C16 66 6 52 6 36 C6 18 20 6 36 6 C52 6 66 18 66 36 C66 52 56 66 36 96Z", p, p.f4);
            sv(g, "circle", { cx: 36, cy: 36, r: 12, fill: p.f3, stroke: p.line, "stroke-width": p.sw * 0.7 });
          }, { origin: "50% 100%" });
          gsap.set(pin.wrap, { autoAlpha: 0 });
          tl.fromTo(pin.wrap, { autoAlpha: 0, y: -ps }, { keyframes: [{ autoAlpha: 1, duration: 0.01 }, { y: 0, duration: 0.2, ease: "power3.in" }, { scaleY: 0.8, duration: 0.06 }, { scaleY: 1, duration: 0.2, ease: "back.out(3)" }] }, there.w.t - 0.15);
          // "fulfill their desire": a heart outline fills up
          const hx = W * (P ? 0.72 : 0.7), hs2 = ps * 0.9;
          const heart = riso(front, hx, bb.y0 + ps / 2, hs2, hs2 * 0.92, [100, 92], (g, p) => {
            const id = S.id + "-hc" + (p.main ? "m" : "s");
            const cp = sv(sv(g, "defs", {}), "clipPath", { id }); const rc = sv(cp, "rect", { x: 0, y: 92, width: 100, height: 92 });
            sv(g, "path", { d: HEART, fill: p.f1, "clip-path": `url(#${id})` });
            return { rc, l: path(g, HEART, p) };
          });
          heart.both((r) => { drawOn(r.l, ful, 0.45); tl.to(r.rc, { attr: { y: 0 }, duration: 0.5, ease: "power2.inOut" }, des.w.t - 0.1); });
          // "hear their prayer": sound arcs rise from the words
          const aw = Math.min(W * 0.5, 700 * u), ah = (ab.y1 - ab.y0);
          const arcs = [];
          const startsA = []; for (let x = hear.w.t; x < S.dur - 0.45; x += 0.2143) startsA.push(x);
          startsA.forEach((t0, i) => {
            const o = riso(back, W / 2, b.top - aw * 0.12, aw, aw * 0.3, [200, 60], (g, p) => { path(g, "M10 56 Q100 -20 190 56", p, null, { stroke: i % 2 ? (p.main ? C.yellow : p.line) : p.f2, "stroke-width": p.sw * 1.4 }); }, { origin: "50% 100%" });
            gsap.set(o.wrap, { autoAlpha: 0 });
            tl.to(o.wrap, { keyframes: [{ autoAlpha: 1, scale: 0.6, duration: 0.01 }, { autoAlpha: 0, scale: 1.35, y: -ah * 0.8, duration: 1.1, ease: "power1.out" }] }, t0);
            arcs.push(o.wrap);
          });
          shakes.push({ t: pr.w.t + 0.05, amp: 12, decay: 0.12 });
        }

        K.pulser(K.pulse, { shakes, down: 0.018, beat: 0.006 });
        K.camera({ z0: 1, z1: 1.05, sway: 0.45 });
        window.__timelines[S.id] = K.done();
      });
    })();
  </script>
</template>
