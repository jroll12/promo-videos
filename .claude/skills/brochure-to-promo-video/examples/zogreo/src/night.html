      tl.fromTo("#nt-hook", { scale: 1, y: 0 }, { scale: 1.12, y: 30, duration: 0.8, ease: "power3.inOut" }, T.hookA);
      tl.fromTo("#nt-ad", { boxShadow: "0 0 0 0px rgba(180, 196, 174, 0)" }, { boxShadow: "0 0 0 4px rgba(180, 196, 174, 0.9)", duration: 0.3, ease: "power2.out" }, T.hookA);
      tl.to("#nt-ad", { boxShadow: "0 0 0 4px rgba(180, 196, 174, 0)", duration: 0.4 }, T.hookB);
      tl.to("#nt-hook", { scale: 1.24, y: 64, duration: 0.8, ease: "power3.inOut" }, T.hookB);
      tl.to("#nt-hook", { scale: 1, y: 0, duration: 0.6, ease: "power3.inOut" }, T.hookOut);

      // 2 · messages pour in
      T.arr.forEach((t, i) => {
        tl.fromTo("#nt-c" + (i + 1), { y: 80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.34, ease: "power3.out" }, t);
      });

      // 3 · they wait in line, the ad is paused, the door closes
      for (let i = 0; i <= 6; i++) {
        const t = T.wait + i * 0.07;
        tl.to("#nt-c" + i + " .nt-now", { autoAlpha: 0, duration: 0.14, ease: "power1.in" }, t);
        tl.fromTo("#nt-c" + i + " .nt-waiting", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: "power3.out" }, t + 0.06);
      }
      tl.fromTo("#nt-ad-knob", { x: 26 }, { x: 0, duration: 0.2, ease: "power2.out" }, T.off);
      tl.fromTo("#nt-ad-track", { backgroundColor: "#5DA95F" }, { backgroundColor: "#7E857C", duration: 0.2 }, T.off);
      tl.fromTo("#nt-ad-dot", { backgroundColor: "#8FD08F" }, { backgroundColor: "#7E857C", duration: 0.2 }, T.off);
      tl.to("#nt-ad-run", { autoAlpha: 0, duration: 0.12 }, T.off);
      tl.fromTo("#nt-ad-off", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.16 }, T.off + 0.08);
      tl.to("#nt-lock", { autoAlpha: 0, duration: 0.9, ease: "power2.inOut" }, T.closing); // the screen goes dark: the door closes

      // 4 · the camera pulls back: one message among a harvest of them
      const cam = { p: 0, q: 0 };
      const applyCam = () => {
        const s = cam.q > 0 ? lerpLog(T.sMin, T.sEnd, cam.q) : lerpLog(1, T.sMin, cam.p);
        gsap.set("#nt-cam", { scale: s });
        gsap.set("#nt-rings", { scale: 0.78 + 0.22 * Math.min(1, s), transformOrigin: "540px 1000px" });
      };
      tl.set("#nt-field", { autoAlpha: 1 }, T.pullStart);
      tl.to(cam, { p: 1, duration: T.pullEnd - T.pullStart, ease: "power3.inOut", onUpdate: applyCam }, T.pullStart);
      tl.fromTo("#nt-scrim", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, T.verse[0] - 0.35);
      document.querySelectorAll("#nt-verse .w").forEach((w, i) => {
        tl.fromTo(w, { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, T.verse[i]);
      });
      tl.fromTo("#nt-ref", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.ref);
      // the workers are few: a second phone, and only two messages answered
      tl.fromTo("#nt-w2", { autoAlpha: 0, scale: 0.92, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.45, ease: "power3.out" }, T.workers);
      tl.fromTo(".nt-r-few", { autoAlpha: 0, scale: 0.4, transformOrigin: "0% 0%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", stagger: 0.18 }, T.few);
      tl.to(["#nt-verse", "#nt-ref"], { autoAlpha: 0, filter: "blur(8px)", duration: 0.22, ease: "power1.in" }, T.verseOut);

      // 5 · zōgreō, to catch alive: the whole field gets an answer
      tl.fromTo("#nt-name span", { autoAlpha: 0.0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out", stagger: 0.07 }, T.zogreo - 0.04);
      tl.fromTo("#nt-pron", { autoAlpha: 0, filter: "blur(4px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.25 }, T.named);
      tl.fromTo("#nt-def", { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3 }, T.def);
      tl.fromTo("#nt-def em", { color: "#B4C4AE" }, { color: "#F3F0E8", duration: 0.3 }, T.catching);
      tl.fromTo(".nt-r-wave", { autoAlpha: 0, scale: 0.4, transformOrigin: "0% 0%" }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(1.6)", stagger: { amount: 1.5 } }, T.catching + 0.1);
      tl.to("#nt-lock", { autoAlpha: 1, duration: 0.9, ease: "power2.inOut" }, T.catching + 0.3); // and wakes when Zogreo answers
      tl.to("#nt-w2-dim", { opacity: 0, duration: 0.9, ease: "power2.inOut" }, T.catching + 0.3);
      tl.to(["#nt-name", "#nt-pron", "#nt-def"], { autoAlpha: 0, filter: "blur(8px)", duration: 0.24, ease: "power1.in" }, T.nameOut);
      tl.to("#nt-scrim", { autoAlpha: 0, duration: 0.35 }, T.nameOut + 0.05);

      // 6 · push back into Layla's phone; the notification opens into the conversation
      tl.to(cam, { q: 1, duration: T.pushEnd - T.pushStart, ease: "power3.inOut", onUpdate: applyCam }, T.pushStart);
      tl.set("#nt-field", { autoAlpha: 0 }, T.pushEnd - 0.05);
      tl.to("#nt-lock", { autoAlpha: 0, filter: "blur(8px)", duration: 0.18, ease: "power1.in" }, T.swap);
      tl.fromTo("#nt-thread", { autoAlpha: 0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, T.swap + 0.1);

      // 7 · the AI answers, in her language
      const dots = (sel, t, n) => {
        for (let k = 0; k < n; k++) {
          tl.fromTo(sel + " .nt-dot", { opacity: 0.35 }, { opacity: 1, duration: 0.14, stagger: 0.1, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + k * 0.5);
        }
      };
      tl.fromTo("#nt-typing", { autoAlpha: 0, scale: 0.8, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: "back.out(1.6)" }, T.typing);
      dots("#nt-typing", T.typing + 0.1, Math.max(1, Math.round((T.answers - T.typing) / 0.5)));
      tl.to("#nt-typing", { autoAlpha: 0, duration: 0.1 }, T.answers);
      tl.fromTo("#nt-m2", { autoAlpha: 0, scale: 0.86, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.5)" }, T.answers);
      tl.fromTo("#nt-m2-meta", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, T.answers + 0.25);
      // heart language: the same thread, now readable in English
      tl.to("#nt-lang-thumb", { x: 104, duration: 0.24, ease: "power3.inOut" }, T.heart);
      tl.to("#nt-seg-ar", { color: "#4B5245", duration: 0.2 }, T.heart);
      tl.to("#nt-seg-en", { color: "#F7F4EC", duration: 0.2 }, T.heart);
      tl.to(["#nt-m1-ar", "#nt-m2-ar"], { autoAlpha: 0, filter: "blur(6px)", duration: 0.16, ease: "power1.in" }, T.heart + 0.05);
      tl.fromTo(["#nt-m1-en", "#nt-m2-en"], { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, T.heart + 0.16);
      // the hard part, answered honestly
      const scroll = (y, t) => tl.to("#nt-chat", { y: -y, duration: 0.42, ease: "power3.out" }, t);
      tl.fromTo("#nt-m3", { autoAlpha: 0, scale: 0.86, transformOrigin: "0% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.5)" }, T.m3);
      scroll(T.scroll[0], T.m4 - 0.05);
      tl.fromTo("#nt-m4", { autoAlpha: 0, scale: 0.86, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.36, ease: "back.out(1.5)" }, T.m4);
      tl.fromTo("#nt-m4-meta", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, T.m4 + 0.3);

      // 8 · ready for a real person; a believer from a local ministry carries it forward
      scroll(T.scroll[1], T.m5 - 0.05);
      tl.fromTo("#nt-m5", { autoAlpha: 0, scale: 0.86, transformOrigin: "0% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" }, T.m5);
      scroll(T.scroll[2], T.ready - 0.05);
      tl.fromTo("#nt-chip", { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.7)" }, T.ready);
      scroll(T.scroll[3], T.believer - 0.05);
      tl.fromTo("#nt-join", { autoAlpha: 0, y: 14 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power3.out" }, T.believer);
      scroll(T.scroll[4], T.carries - 0.05);
      tl.fromTo("#nt-believer", { autoAlpha: 0, scale: 0.84, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(1.5)" }, T.carries);
      dots("#nt-believer", T.carries + 0.2, Math.max(1, Math.round((T.exit - T.carries - 0.3) / 0.5)));

      // exit: cut the curve, leftward
      tl.to("#nt-stage", { x: -230, duration: 0.32, ease: "power4.in" }, T.exit);
      tl.to("#nt-stage", { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "none" }, T.exit);

      window.__timelines["night"] = tl;
    })();
  </script>
</template>
