                    <div data-hf-id="hf-8p8x" class="nt-ar2" id="nt-m1-ar">مرحبًا، رأيت إعلانكم وأودّ أن أعرف:<br data-hf-id="hf-szow" />ما هو الأمل الذي تحدثتم عنه؟</div>

                  <div data-hf-id="hf-hhni" class="nt-msg nt-b nt-out nt-dual" id="nt-m2" style="top:266px">
                    <div data-hf-id="hf-d5e7" class="nt-ar2" id="nt-m2-ar">أهلًا ليلى، شكرًا على سؤالك.<br data-hf-id="hf-qluq" />هل حدث شيء جعلكِ تفقدين<br data-hf-id="hf-q7jp" />الأمل مؤخرًا؟</div>

                  <div data-hf-id="hf-svbt" class="nt-msg nt-b nt-in" id="nt-m3" style="top:540px">My family fled from war,<br data-hf-id="hf-p0mm" />and we are refugees in<br data-hf-id="hf-ombl" />an unfamiliar country.</div>
                  <div data-hf-id="hf-6qsr" class="nt-msg nt-b nt-out" id="nt-m4a" style="top:740px">That is a big burden to carry.</div>
                  <div data-hf-id="hf-n08t" class="nt-msg nt-b nt-out" id="nt-m4b" style="top:842px">Jesus offers hope to all<br data-hf-id="hf-qsyj" />that wish to receive it.<br data-hf-id="hf-r79k" />Can I connect you with someone<br data-hf-id="hf-q0ch" />who can pray for you and tell<br data-hf-id="hf-qeni" />you more about Jesus?</div>

    <div data-hf-id="hf-q1qv" id="nt-verse"><span data-hf-id="hf-ys6r" class="w">The</span> <span data-hf-id="hf-towp" class="w">harvest</span> <span data-hf-id="hf-fj2o" class="w">is</span> <span data-hf-id="hf-9ynx" class="w">plentiful,</span><br data-hf-id="hf-pm1g" /><span data-hf-id="hf-ucmn" class="w">but</span> <span data-hf-id="hf-9o0j" class="w">the</span> <span data-hf-id="hf-jden" class="w">workers</span> <span data-hf-id="hf-7nje" class="w">are</span> <span data-hf-id="hf-fr20" class="w"><em data-hf-id="hf-yxer">few.</em></span></div>

    <div data-hf-id="hf-xcd4" id="nt-pron">ZO · GRAY · OH</div>
    <div data-hf-id="hf-z0ks" id="nt-def"><span data-hf-id="hf-ipxk" class="gk">ζωγρέω</span> · <em data-hf-id="hf-i4jg">to catch alive</em> · Luke 5:10</div>
  </div>

  <script>
    (function () {
      const T = {"hookA":3.28,"hookB":4.1,"hookOut":6.92,"arr":[7.101,7.559,8.047,8.565,9.084,9.602],"stackPush":9.902,"wait":11.28,"adPush":12.28,"off":13.28,"clockEnd":13.18,"door":15.28,"closes":15.6,"pullStart":16.26,"pullEnd":18.26,"verse":[16.8,17.04,17.52,17.76,18.48,18.72,18.88,19.28,19.52],"few":19.52,"ref":18.48,"verseOut":20.92,"zogreo":21.36,"its":22.4,"def":22.72,"catching":24,"wake":24.3,"nameOut":25.44,"pushStart":25.51,"pushEnd":26.81,"swap":26.29,"typing":26.83,"answers":27.28,"heart":29.2,"stream":1.72,"toggle":30.19,"m3":30.85,"m4":31.6,"m4b":32.54,"m5":33.04,"ready":33.52,"believer":36.24,"climaxScroll":35.62,"handoffPush":33.97,"exit":38.32,"sMin":0.14,"sEnd":1.12,"chatY":{"start":240,"m3":100,"m4":0,"m4b":-200,"m5":-350,"ready":-440,"climax":-760}};
      const tl = gsap.timeline({ paused: true });
      const lerpLog = (a, b, p) => Math.exp(Math.log(a) + (Math.log(b) - Math.log(a)) * p);
      // everything on the lock screen except Layla's card, which stays lit when the door closes
      const others = ["#nt-lock .nt-status", "#nt-clock", "#nt-ad", "#nt-c1", "#nt-c2", "#nt-c3", "#nt-c4", "#nt-c5", "#nt-c6"];

      // Hidden-until-cued states, set once at build time.
      gsap.set(["#nt-scrim", "#nt-ref", "#nt-pron", "#nt-def", "#nt-field", "#nt-m2-meta", "#nt-m4-meta"], { autoAlpha: 0 });
      gsap.set(["#nt-verse .w", "#nt-name span"], { autoAlpha: 0 });
      gsap.set(".nt-waiting", { autoAlpha: 0 });
      gsap.set("#nt-ad-off", { autoAlpha: 0 });
      gsap.set(["#nt-m3", "#nt-m4a", "#nt-m4b", "#nt-m5", "#nt-chip", "#nt-believer", "#nt-m2", "#nt-typing", "#nt-m1-en", "#nt-m2-en"], { autoAlpha: 0 });
      gsap.set("#nt-seg-ar", { color: "#F7F4EC" });
      gsap.set("#nt-seg-en", { color: "#4B5245" });
      gsap.set(".nt-r", { autoAlpha: 0 });
      gsap.set("#nt-chat", { y: T.chatY.start });

      // 1 · the 2 a.m. message (frame 0 is the thumbnail: the card is already on screen), and the camera is already moving in
      tl.fromTo("#nt-c0", { scale: 1.03 }, { scale: 1, duration: 0.6, ease: "power3.out" }, 0);
      tl.fromTo("#nt-hook", { scale: 1, y: 0 }, { scale: 1.06, y: 14, duration: T.hookA, ease: "sine.inOut" }, 0);
      // the camera finds the ad, then her question; it pulls back as the others arrive
      tl.to("#nt-hook", { scale: 1.12, y: 30, duration: 0.8, ease: "power3.inOut" }, T.hookA);
      tl.fromTo("#nt-ad", { boxShadow: "0 0 0 0px rgba(180, 196, 174, 0)" }, { boxShadow: "0 0 0 4px rgba(180, 196, 174, 0.9)", duration: 0.3, ease: "power2.out" }, T.hookA);
      tl.to("#nt-ad", { boxShadow: "0 0 0 4px rgba(180, 196, 174, 0)", duration: 0.4 }, T.hookB);
      tl.to("#nt-hook", { scale: 1.24, y: 64, duration: 0.8, ease: "power3.inOut" }, T.hookB);
      tl.to("#nt-hook", { scale: 1.29, y: 78, duration: Math.max(0.3, T.hookOut - T.hookB - 0.8), ease: "sine.inOut" }, T.hookB + 0.8);
      tl.to("#nt-hook", { scale: 1, y: 0, duration: 0.6, ease: "power3.inOut" }, T.hookOut);

      // 2 · messages pour in
      T.arr.forEach((t, i) => {
        tl.fromTo("#nt-c" + (i + 1), { y: 80, autoAlpha: 0 }, { y: 0, autoAlpha: 1, duration: 0.34, ease: "power3.out" }, t);
      });

      tl.to("#nt-hook", { scale: 1.05, y: -20, duration: Math.max(0.4, T.wait - T.stackPush), ease: "sine.inOut" }, T.stackPush);

      // 3 · seekers wait: every message turns to "waiting" while the clock runs on
      for (let i = 0; i <= 6; i++) {
        const t = T.wait + i * 0.07;
        tl.to("#nt-c" + i + " .nt-now", { autoAlpha: 0, duration: 0.14, ease: "power1.in" }, t);
        tl.fromTo("#nt-c" + i + " .nt-waiting", { autoAlpha: 0, y: 8 }, { autoAlpha: 1, y: 0, duration: 0.22, ease: "power3.out" }, t + 0.06);
      }
      const clock = document.getElementById("nt-clock");
      const clk = { m: 127 }; // minutes after midnight: 2:07
      const showTime = () => { const v = Math.round(clk.m); clock.textContent = Math.floor(v / 60) + ":" + String(v % 60).padStart(2, "0"); };
      tl.to(clk, { m: 222, duration: T.clockEnd - T.wait, ease: "power1.inOut", onUpdate: showTime }, T.wait);
      // the ministry turns off its ad: the camera goes in on the switch
      tl.to("#nt-hook", { scale: 1.3, y: 190, duration: 0.55, ease: "power3.inOut" }, T.adPush);
      tl.to("#nt-hook", { scale: 1.36, y: 205, duration: Math.max(0.3, T.door - T.adPush - 0.55), ease: "sine.inOut" }, T.adPush + 0.55);
      tl.fromTo("#nt-ad-knob", { x: 26 }, { x: 0, duration: 0.2, ease: "power2.out" }, T.off);
      tl.fromTo("#nt-ad-track", { backgroundColor: "#5DA95F" }, { backgroundColor: "#7E857C", duration: 0.2 }, T.off);
      tl.fromTo("#nt-ad-dot", { backgroundColor: "#8FD08F" }, { backgroundColor: "#7E857C", duration: 0.2 }, T.off);
      tl.to("#nt-ad-run", { autoAlpha: 0, duration: 0.12 }, T.off);
      tl.fromTo("#nt-ad-off", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.16 }, T.off + 0.08);
      // and the door closes: the camera steps back as the screen goes dark around her unanswered message
      tl.to("#nt-hook", { scale: 1, y: 0, duration: 0.7, ease: "power3.inOut" }, T.door);
      tl.to("#nt-lockdark", { opacity: 1, duration: 0.9, ease: "power2.inOut" }, T.closes);
      tl.to(others, { autoAlpha: 0, duration: 0.7, ease: "power2.inOut" }, T.closes);

      // 4 · the camera pulls back: her message, one among a harvest of them
      const cam = { p: 0, d: 0, q: 0 };
      const sMid = T.sMin * 1.22;
      const applyCam = () => {
        const s = cam.q > 0 ? lerpLog(sMid, T.sEnd, cam.q) : cam.d > 0 ? lerpLog(T.sMin, sMid, cam.d) : lerpLog(1, T.sMin, cam.p);
        gsap.set(["#nt-cam", "#nt-cam2"], { scale: s });
        gsap.set("#nt-rings", { scale: 0.78 + 0.22 * Math.min(1, s), transformOrigin: "540px 1000px" });
      };
      tl.set("#nt-field", { autoAlpha: 1 }, T.pullStart);
      tl.to(cam, { p: 1, duration: T.pullEnd - T.pullStart, ease: "power3.inOut", onUpdate: applyCam }, T.pullStart);
      // then the camera keeps travelling in, toward the phones, while the verse and the name are read
      tl.to(cam, { d: 1, duration: T.pushStart - T.pullEnd, ease: "sine.inOut", onUpdate: applyCam }, T.pullEnd);
      tl.fromTo("#nt-scrim", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.5, ease: "power2.out" }, T.verse[0] - 0.35);
      document.querySelectorAll("#nt-verse .w").forEach((w, i) => {
        tl.fromTo(w, { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.16, ease: "power2.out" }, T.verse[i]);
      });
      tl.fromTo("#nt-ref", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.ref);
      // the workers are few: of all those messages, only two get an answer
      tl.fromTo(".nt-r-few", { autoAlpha: 0, scale: 0.4, transformOrigin: "0% 0%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", stagger: 0.18 }, T.few);
      tl.to(["#nt-verse", "#nt-ref"], { autoAlpha: 0, filter: "blur(8px)", duration: 0.22, ease: "power1.in" }, T.verseOut);

      // 5 · zōgreō, to catch alive: the whole field gets an answer, and her phone wakes with the door open again
      tl.fromTo("#nt-name span", { autoAlpha: 0.0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out", stagger: 0.07 }, T.zogreo - 0.04);
      tl.fromTo("#nt-pron", { autoAlpha: 0, filter: "blur(4px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.25 }, T.its);
      tl.fromTo("#nt-def", { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3 }, T.def);
      tl.fromTo("#nt-def em", { color: "#B4C4AE" }, { color: "#F3F0E8", duration: 0.3 }, T.catching);
      tl.fromTo(".nt-r-wave", { autoAlpha: 0, scale: 0.4, transformOrigin: "0% 0%" }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(1.6)", stagger: { amount: 1.5 } }, T.catching + 0.1);
      // while it is still dark and tiny: nobody waiting, the ad running, the clock back at 2:07
      tl.to(clk, { m: 127, duration: 0.05, onUpdate: showTime }, T.wake - 0.12);
      tl.set(".nt-waiting", { autoAlpha: 0 }, T.wake - 0.1);
      tl.set(".nt-now", { autoAlpha: 1 }, T.wake - 0.1);
      tl.set("#nt-ad-knob", { x: 26 }, T.wake - 0.1);
      tl.set(["#nt-ad-track"], { backgroundColor: "#5DA95F" }, T.wake - 0.1);
      tl.set(["#nt-ad-dot"], { backgroundColor: "#8FD08F" }, T.wake - 0.1);
      tl.set("#nt-ad-run", { autoAlpha: 1 }, T.wake - 0.1);
      tl.set("#nt-ad-off", { autoAlpha: 0 }, T.wake - 0.1);
      tl.to("#nt-lockdark", { opacity: 0, duration: 0.9, ease: "power2.inOut" }, T.wake);
      tl.to(others, { autoAlpha: 1, duration: 0.9, ease: "power2.inOut" }, T.wake);
      tl.to(["#nt-name", "#nt-pron", "#nt-def"], { autoAlpha: 0, filter: "blur(8px)", duration: 0.24, ease: "power1.in" }, T.nameOut);
      tl.to("#nt-scrim", { autoAlpha: 0, duration: 0.35 }, T.nameOut + 0.05);

      // 6 · push back into the phone; the notification opens into the conversation
      tl.to(cam, { q: 1, duration: T.pushEnd - T.pushStart, ease: "power3.inOut", onUpdate: applyCam }, T.pushStart);
      tl.set("#nt-field", { autoAlpha: 0 }, T.pushEnd - 0.05);
      tl.to("#nt-lock", { autoAlpha: 0, filter: "blur(8px)", duration: 0.18, ease: "power1.in" }, T.swap);
      tl.fromTo("#nt-thread", { autoAlpha: 0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.22, ease: "power2.out" }, T.swap + 0.1);

      // 7 · the AI answers in her language, and stays in it while "heart language" is said
      const dots = (sel, t, n) => {
        for (let k = 0; k < n; k++) {
          tl.fromTo(sel + " .nt-dot", { opacity: 0.35 }, { opacity: 1, duration: 0.14, stagger: 0.1, yoyo: true, repeat: 1, ease: "sine.inOut" }, t + k * 0.5);
        }
      };
      tl.fromTo("#nt-typing", { autoAlpha: 0, scale: 0.8, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.2, ease: "back.out(1.6)" }, T.typing);
      dots("#nt-typing", T.typing + 0.1, Math.max(1, Math.round((T.answers - T.typing) / 0.5)));
      tl.to("#nt-typing", { autoAlpha: 0, duration: 0.1 }, T.answers);
      tl.fromTo("#nt-m2", { autoAlpha: 0, scale: 0.86, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.5)" }, T.answers);
      tl.fromTo("#nt-m2-ar", { clipPath: "inset(0% 0% 0% 100%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: T.stream, ease: "none" }, T.answers + 0.05);
      tl.fromTo("#nt-m2-meta", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, T.answers + T.stream);
      tl.fromTo("#nt-lang", { boxShadow: "0 0 0 0px rgba(93, 169, 95, 0)" }, { boxShadow: "0 0 0 6px rgba(93, 169, 95, 0.65)", duration: 0.3, ease: "power2.out" }, T.heart);
      tl.to("#nt-lang", { boxShadow: "0 0 0 6px rgba(93, 169, 95, 0)", duration: 0.5 }, T.toggle + 0.3);
      // then the view switches to English so we can follow her
      tl.to("#nt-lang-thumb", { x: 104, duration: 0.24, ease: "power3.inOut" }, T.toggle);
      tl.to("#nt-seg-ar", { color: "#4B5245", duration: 0.2 }, T.toggle);
      tl.to("#nt-seg-en", { color: "#F7F4EC", duration: 0.2 }, T.toggle);
      tl.to(["#nt-m1-ar", "#nt-m2-ar"], { autoAlpha: 0, filter: "blur(6px)", duration: 0.16, ease: "power1.in" }, T.toggle + 0.05);
      tl.fromTo(["#nt-m1-en", "#nt-m2-en"], { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.2, ease: "power2.out" }, T.toggle + 0.16);
      // the hard part, answered honestly: the empathy line arrives alone, then the rest
      const scroll = (y, t) => tl.to("#nt-chat", { y, duration: 0.42, ease: "power3.out" }, t);
      scroll(T.chatY.m3, T.m3 - 0.05);
      tl.fromTo("#nt-m3", { autoAlpha: 0, scale: 0.86, transformOrigin: "0% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.5)" }, T.m3);
      scroll(T.chatY.m4, T.m4 - 0.05);
      tl.fromTo("#nt-m4a", { autoAlpha: 0, scale: 0.86, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.5)" }, T.m4);
      scroll(T.chatY.m4b, T.m4b - 0.05);
      tl.fromTo("#nt-m4b", { autoAlpha: 0, scale: 0.9, transformOrigin: "100% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.36, ease: "back.out(1.4)" }, T.m4b);
      tl.fromTo("#nt-m4-meta", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, T.m4b + 0.3);

      // 8 · ready for a real person, a breath of stillness, then the climax: a believer from a local ministry joins
      scroll(T.chatY.m5, T.m5 - 0.05);
      tl.fromTo("#nt-m5", { autoAlpha: 0, scale: 0.86, transformOrigin: "0% 100%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.5)" }, T.m5);
      scroll(T.chatY.ready, T.ready - 0.05);
      tl.fromTo("#nt-hook", { scale: 1, y: 0 }, { scale: 1.08, y: -29.4, duration: T.exit - T.handoffPush, ease: "sine.inOut", immediateRender: false }, T.handoffPush); // = scaling about the believer card (y 1115)
      tl.fromTo("#nt-chip", { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.34, ease: "back.out(1.7)" }, T.ready);
      scroll(T.chatY.climax, T.climaxScroll);
