          const rays = riso(back, rq.cx, rq.cy, rq.w, rq.h, [400, 220], (g, p) => {
            const out = [];
            for (let i = 0; i < 9; i++) {
              const a = Math.PI * (1.08 + (0.84 * i) / 8) * (up ? 1 : -1), r0 = 70 + (i % 2) * 18, r1 = i % 2 ? 165 : 205;
              const ox = 200, oy = up ? 214 : 6;
              out.push(path(g, `M${ox + Math.cos(a) * r0} ${oy + Math.sin(a) * r0} L${ox + Math.cos(a) * r1} ${oy + Math.sin(a) * r1}`, p, null, { stroke: p.main ? (i % 2 ? C.yellow : C.pink) : p.line, "stroke-width": p.sw * 1.5 }));
            }
            return { out };
          }, { origin: up ? "50% 100%" : "50% 0%" });
          rays.both((r) => r.out.forEach((x, i) => K.draw(x, glory.w.t + Math.abs(i - 4) * 0.03, 0.3)));
          K.drive((t) => gsap.set(rays.inner, { scale: 1 + 0.06 * Math.max(0, Math.sin((t - glory.w.t) * Math.PI / 0.4286)) }));
          // the bolt strikes beside the rays (same band), on whichever side has room
          let bq = placeV(power, 150 * u, 250 * u, "auto", { gap: 6 * u });
          if (bq.where === rq.where && Math.abs(bq.cx - rq.cx) < (rq.w + bq.w) / 2) {
            const right = rq.cx + rq.w / 2 + bq.w * 0.6, left = rq.cx - rq.w / 2 - bq.w * 0.6;
            bq = Object.assign({}, bq, { cx: right + bq.w / 2 < W - M ? right : left, cy: rq.cy + (rq.h - bq.h) / 2 * (up ? 1 : -1) });
          }
          const bolt = riso(front, bq.cx, bq.cy, bq.w, bq.h, [120, 200], (g, p) => { path(g, "M72 6 L18 112 H58 L38 194 L104 78 H64 L88 6 Z", p, p.f2); });
          gsap.set(bolt.wrap, { autoAlpha: 0 });
          tl.fromTo(bolt.wrap, { autoAlpha: 0, y: -bq.h * 0.8, scale: 1.4 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.12, ease: "power4.in" }, power.w.t - 0.06);
          shakes.push({ t: power.w.t + 0.06, amp: 18, decay: 0.1, rot: 0.8 });
          K.drive((t) => gsap.set(bolt.inner, { rotation: t > power.w.t ? 4 * Math.sin((t - power.w.t) * 22) * Math.exp(-(t - power.w.t) * 2) : 0 }));
          // "let it echo louder": outline echoes of LOUDER spread out
          const fs = louder.box.h / 1.02;
          [0, 1, 2, 3].forEach((k) => {
            const e = el("div", "v-echo k-type " + louder.acc + (k % 2 ? " b" : ""), front, louder.w.w);
            Object.assign(e.style, { left: louder.box.x + "px", top: louder.box.y + "px", fontSize: fs + "px", width: louder.box.w + "px", height: louder.box.h + "px", textShadow: "none" });
            gsap.set(e, { autoAlpha: 0 });
            tl.fromTo(e, { autoAlpha: 0, scale: 1 }, { keyframes: [{ autoAlpha: 0.9, scale: 1.02, duration: 0.02 }, { autoAlpha: 0, scale: 1.55 + k * 0.18, duration: 0.75, ease: "power2.out" }] }, louder.w.t + 0.08 + k * 0.107);
          });
          exitWith(b, [rays.wrap, bolt.wrap]);
        }

        // ── B4 "Majestic, mighty, beyond what we can say," ──
        {
          const b = blocks[4], l = L(8), maj = A(8, "majestic"), mig = A(8, "mighty");
          const bd = bandBelow(b), mh = Math.min((bd.y1 - bd.y0 + M) * 0.92, H * (P ? 0.3 : 0.44));
          const range = riso(back, W / 2, H - mh * 0.36 + 6 * u, W * 1.08, mh * 0.72, [600, 300], (g, p) => {
            path(g, "M-10 306 L100 120 L180 200 L290 70 L410 216 L500 130 L610 306Z", p, p.f1);
            path(g, "M262 104 L290 70 L318 104 L304 98 L290 112 L276 98Z", p, p.f3, { "stroke-width": p.sw * 0.7 });
            path(g, "M82 150 L100 120 L118 150 L100 140Z", p, p.f3, { "stroke-width": p.sw * 0.7 });
          });
          const peak = riso(back, W * (P ? 0.6 : 0.64), H - mh / 2 + 6 * u, mh * 1.1, mh, [330, 300], (g, p) => {
            path(g, "M0 306 L165 16 L330 306Z", p, p.f2);
            path(g, "M120 95 L165 16 L210 95 L188 84 L165 104 L142 84Z", p, p.f3, { "stroke-width": p.sw * 0.7 });
          });
          [[range, maj.w.t, mh * 0.72], [peak, mig.w.t, mh]].forEach(([o, t, h]) => {
            gsap.set(o.wrap, { autoAlpha: 0, y: h });
            tl.to(o.wrap, { keyframes: [{ autoAlpha: 1, duration: 0.01 }, { y: 0, duration: 0.45, ease: "back.out(1.5)" }] }, t - 0.05);
          });
          shakes.push({ t: maj.w.t + 0.08, amp: 10, decay: 0.12 }, { t: mig.w.t + 0.08, amp: 20, decay: 0.12, rot: 0.8 });
          // a flag goes up on the high peak through the hold
          const fl = riso(back, W * (P ? 0.6 : 0.64) + mh * 0.07, H - mh + 6 * u - mh * 0.08, mh * 0.18, mh * 0.2, [60, 66], (g, p) => {
            path(g, "M6 64 L6 4", p);
            return { f: path(g, "M6 6 L54 16 L6 28Z", p, p.f1, { "stroke-width": p.sw * 0.8 }) };
          }, { origin: "0% 100%" });
          pop(fl.wrap, mig.w.t + 0.35, { s0: 0, r0: 0 });
          K.drive((t) => fl.both((r) => r.f.setAttribute("transform", `skewY(${(6 * Math.sin(t * 9)).toFixed(2)})`)));
          // "beyond what we can say": a speech bubble that only gets dots
          const ab = bandAbove(b), bh = Math.min(200 * u, (ab.y1 - ab.y0) * 0.85), bw = bh * 1.33;
          const bub = riso(front, P ? W * 0.5 : W * 0.78, ab.y1 - bh / 2, bw, bh, [200, 150], (g, p) => {
            path(g, "M30 10 H170 Q190 10 190 30 V90 Q190 110 170 110 H130 L100 142 L104 110 H30 Q10 110 10 90 V30 Q10 10 30 10Z", p, p.f3);
            return { dots: [60, 100, 140].map((x) => sv(g, "circle", { cx: x, cy: 60, r: 13, fill: p.main ? C.pink : p.line })) };
          });
          pop(bub.wrap, l.w[2].t, { r0: -12 });
          bub.both((r) => r.dots.forEach((d, i) => { gsap.set(d, { autoAlpha: 0 }); tl.fromTo(d, { autoAlpha: 0, attr: { r: 0 } }, { autoAlpha: 1, attr: { r: 13 }, duration: 0.16, ease: "back.out(3)" }, l.w[3 + i].t); }));
          tl.to(bub.inner, { keyframes: [{ scaleX: 1.15, scaleY: 0.85, duration: 0.08 }, { scaleX: 1, scaleY: 1, duration: 0.35, ease: "elastic.out(1.1,0.4)" }] }, l.w[6].t);
          exitWith(b, [range.wrap, peak.wrap, fl.wrap, bub.wrap]);
        }

        // ── B5 "Your works keep giving us a reason every day." ──
        {
          const b = blocks[5], l = L(9);
          const bd = bandBelow(b), gs = Math.min((bd.y1 - bd.y0) * 0.5, 240 * u), gcy = bd.y1 - gs * 0.5;
          const box = riso(back, W / 2, gcy, gs, gs * (110 / 160), [160, 110], (g, p) => {
            sv(g, "rect", { x: 15, y: 20, width: 130, height: 86, fill: p.f1, stroke: p.line, "stroke-width": p.sw });
            sv(g, "rect", { x: 69, y: 20, width: 22, height: 86, fill: p.f2, stroke: p.line, "stroke-width": p.sw });
          });
          const lid = riso(back, W / 2, gcy - gs * (110 / 160) / 2 - gs * 0.04, gs * 1.08, gs * 0.32, [172, 52], (g, p) => {
            path(g, "M86 22 C60 -4 40 6 52 22 Z M86 22 C112 -4 132 6 120 22 Z", p, p.f2, { "stroke-width": p.sw * 0.8 });
            sv(g, "rect", { x: 4, y: 22, width: 164, height: 28, fill: p.f1, stroke: p.line, "stroke-width": p.sw });
            sv(g, "rect", { x: 75, y: 22, width: 22, height: 28, fill: p.f2, stroke: p.line, "stroke-width": p.sw });
          }, { origin: "10% 100%" });
          pop(box.wrap, l.w[2].t, { r0: 0 }); pop(lid.wrap, l.w[2].t, { r0: 0 });
          const tg = l.w[3].t;
          tl.fromTo(lid.inner, { y: 0, rotation: 0 }, { y: -gs * 0.22, rotation: -24, duration: 0.25, ease: "back.out(2.5)" }, tg);
          // gifts keep coming out, on every eighth note
          const top = gcy - gs * 0.4, rise = Math.max(gs * 0.8, top - (b.top + b.h) - 30 * u);
          const kinds = ["heart", "star", "dot", "spark"];
          const items = [];
          for (let t = tg + 0.05, i = 0; t < b.tout - 0.6; t += 0.2143, i++) items.push({ t, i, k: kinds[i % 4], dx: (rnd() - 0.5) * 2, s: 0.6 + rnd() * 0.6 });
          items.forEach((it) => {
            const s = 64 * u * it.s;
            const o = riso(front, W / 2, top, s, s, [100, 100], (g, p) => {
              if (it.k === "heart") path(g, "M50 88 C20 66 6 48 6 32 C6 16 18 6 32 6 C42 6 48 12 50 18 C52 12 58 6 68 6 C82 6 94 16 94 32 C94 48 80 66 50 88Z", p, p.f1);
              else if (it.k === "star") path(g, star5(50, 52, 46, 20), p, p.f2);
              else if (it.k === "dot") sv(g, "circle", { cx: 50, cy: 50, r: 38, fill: p.f4, stroke: p.line, "stroke-width": p.sw });
              else path(g, SPARK, p, p.f2);
            }, { off: 4 });
            const life = 1.25, spread = (P ? 0.38 : 0.3) * W;
            gsap.set(o.wrap, { autoAlpha: 0 });
            K.drive((t) => {
              const q = (t - it.t) / life;
              if (q < 0 || q > 1 || t > b.tout) { gsap.set(o.wrap, { autoAlpha: 0 }); return; }
              const e = ease3(q);
              gsap.set(o.wrap, { autoAlpha: K.clamp(q * 8, 0, 1) * K.clamp((1 - q) * 4, 0, 1), x: it.dx * spread * e, y: -rise * (1.6 * q - 0.6 * q * q), rotation: it.dx * 90 * q, scale: 0.4 + 0.6 * K.clamp(q * 4, 0, 1) });
            });
          });
          exitWith(b, [box.wrap, lid.wrap]);
        }

        // ── B6 "I will think about the splendor of Your reign," ──
        {
          const b = blocks[6], l = L(10), think = A(10, "think"), spl = A(10, "splendor");
          const q = placeV(think, 200 * u, 200 * u, "above", { gap: 0.03 * H });
          const bub = [[0.14, 0.92, 26], [0.42, 0.62, 40], [0.82, 0.24, 62]].map(([fx, fy, r], i) => {
            const o = riso(front, q.cx - q.w * 0.3 + fx * q.w, q.cy - q.h / 2 + fy * q.h, r * 2 * u * q.s, r * 2 * u * q.s, [100, 100], (g, p) => { sv(g, "circle", { cx: 50, cy: 50, r: 44, fill: p.f3, stroke: p.line, "stroke-width": p.sw }); }, { off: 5 });
            pop(o.wrap, think.w.t + i * 0.12, { s0: 0, r0: 0 });
            K.drive((t) => gsap.set(o.inner, { y: Math.sin(t * 3 + i) * 6 * u }));
            return o.wrap;
          });
          // the splendor: a sunburst opens behind the line and keeps turning
          const R = Math.hypot(W, H) * 0.62, cx = W / 2, cy = b.top + b.h / 2;
          const sun = riso(back, cx, cy, R * 2, R * 2, [1000, 1000], (g, p) => {
            for (let i = 0; i < 24; i += 2) {
              const a0 = (i * Math.PI * 2) / 24, a1 = ((i + 1) * Math.PI * 2) / 24;
              sv(g, "path", { d: `M500 500 L${500 + Math.cos(a0) * 500} ${500 + Math.sin(a0) * 500} L${500 + Math.cos(a1) * 500} ${500 + Math.sin(a1) * 500}Z`, fill: C.yellow });
            }
            sv(g, "circle", { cx: 500, cy: 500, r: 150, fill: "none", stroke: C.orange, "stroke-width": 10, "stroke-dasharray": "2 26", "stroke-linecap": "round" });
          }, { noShadow: true });
          gsap.set(sun.wrap, { autoAlpha: 0 });
          tl.fromTo(sun.wrap, { autoAlpha: 0, scale: 0 }, { autoAlpha: 1, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, spl.w.t - 0.05);
          K.drive((t) => gsap.set(sun.inner, { rotation: Math.max(0, t - spl.w.t) * 9 }));
          shakes.push({ t: L(10).w[8].t + 0.05, amp: 8, decay: 0.1 });
          exitWith(b, [sun.wrap, ...bub]);
        }

        // ── B7 "And tell the next generation what Your hands have made." ──
        {
          const b = blocks[7], l = L(11), hands = A(11, "hands"), made = A(11, "made");
          const bands = [bandAbove(b), bandBelow(b)];
          const placed = [];
          const spot = (r, band) => {
            for (let k = 0; k < 60; k++) {
              const x = M + r + rnd() * (W - 2 * M - 2 * r), y = band.y0 + r + rnd() * Math.max(1, band.y1 - band.y0 - 2 * r);
              if (placed.every((p) => Math.hypot(p.x - x, p.y - y) > p.r + r + 20 * u)) { placed.push({ x, y, r }); return { x, y }; }
            }
            return null;
          };
          const pr = Math.min(110 * u, (bands[1].y1 - bands[1].y0) * 0.45), pr2 = Math.min(80 * u, (bands[0].y1 - bands[0].y0) * 0.45);
          const p1 = spot(pr, bands[1]), p2 = spot(pr2, bands[0]);
          const planet = (pt, r, t, body, ring) => {
            if (!pt) return null;
            const o = riso(front, pt.x, pt.y, r * 2.6, r * 2.6, [260, 260], (g, p) => {
              sv(g, "circle", { cx: 130, cy: 130, r: 96, fill: p[body], stroke: p.line, "stroke-width": p.sw });
              if (ring) path(g, "M28 158 C10 120 250 80 232 102", p, null, { "stroke-width": p.sw * 1.2 });
              else [[100, 104, 16], [160, 150, 22], [120, 176, 10]].forEach(([x, y, rr]) => sv(g, "circle", { cx: x, cy: y, r: rr, fill: p.f3, stroke: p.line, "stroke-width": p.sw * 0.7 }));
            });
            pop(o.wrap, t, { r0: -40, d: 0.35 });
            K.drive((tt) => gsap.set(o.inner, { rotation: Math.sin(tt * 1.3) * 8, y: Math.sin(tt * 2.1) * 8 * u }));
            return o;
          };
          planet(p1, pr, hands.w.t - 0.03, "f1", true);
          planet(p2, pr2, made.w.t - 0.03, "f2", false);
          const beats = S.beats.filter((x) => x > l.t + 0.15 && x < S.dur - 0.3);
          beats.forEach((bt, i) => {
            const r = (24 + rnd() * 30) * u, pt = spot(r, bands[i % 2]);
            if (!pt) return;
            const o = i % 3 === 2
              ? riso(front, pt.x, pt.y, r * 2, r * 2, [100, 100], (g, p) => { path(g, star5(50, 54, 48, 21), p, p.f2); }, { off: 5 })
              : sparkle(front, pt.x, pt.y, r * 2, i % 2 ? "f1" : "f2");
            pop(o.wrap, bt, { s0: 0, r0: -120 });
            K.drive((t) => gsap.set(o.inner, { rotation: t * 30 * (i % 2 ? 1 : -1), scale: 1 + 0.15 * Math.sin(t * 6 + i) }));
          });
        }

        K.pulser(K.pulse, { shakes, down: 0.016, beat: 0.005 });
        K.camera({ z0: 1, z1: 1.04, sway: 0.35 });
        window.__timelines[S.id] = K.done();
      });
    })();
  </script>
</template>
