      // Shared lyric kit, inlined into every scene by tools/build.mjs (each scene gets its own copy and scope).

      }

    const lines = cfg.lines || S.lines;
    const groups = cfg.groups || lines.reduce((g, _, i) => (i % 2 ? g : [...g, [i, i + 1].filter((j) => j < lines.length)]), []);

    groups.forEach((g, gi) => {

      const fits = g.map((li) => fitLine(lines[li], o, li));
      const base = Math.min(...fits.map((f) => f.size));
      const sizes = fits.map((f) => Math.min(f.size, base * o.spread));
      let y = 0;
      const Ls = g.map((li, k) => {
        const L = buildLine(blk, lines[li], li, fits[k].rows, sizes[k], o);

        L.y = y; y += L.h;
        return Object.assign(L, { li, line: lines[li] });
      });

        }

        K.pulser(K.pulse, { shakes, down: 0.022, beat: 0.008 });
