const fr = [.1,.24,.38,.52,.66,.8,.94];
const dots = document.getElementById("dots"); const NS = "http://www.w3.org/2000/svg";
const dn = fr.map((f,i)=>{ const p=j.getPointAtLength(jl*f); const g=document.createElementNS(NS,"g"); g.setAttribute("transform",`translate(${p.x} ${p.y})`);
  const r=document.createElementNS(NS,"circle"); r.setAttribute("r","0"); r.setAttribute("fill","#F3F0E8"); r.setAttribute("fill-opacity",".4"); r.setAttribute("stroke","#F3F0E8"); r.setAttribute("stroke-opacity",".6"); r.setAttribute("stroke-width","3");
  const ring=document.createElementNS(NS,"circle"); ring.setAttribute("r","30"); ring.setAttribute("fill","none"); ring.setAttribute("stroke","#B4C4AE"); ring.setAttribute("stroke-width","4"); ring.setAttribute("opacity","0");
  g.appendChild(ring); g.appendChild(r); dots.appendChild(g); return {r,ring}; });
enter("#s2", S(2,"our")-.0);

dn.forEach((d,i)=> tl.to(d.r, { attr:{ r:22 }, duration:.35, ease:POP }, S(2,"finds")+.15+i*.16));
/* the people most open, first: far end of the path lights up before the rest */
[[6,"people"],[5,"most"],[4,"open"]].forEach(([i,w],k)=>{
  tl.to(dn[i].r, { attr:{ r:30 }, fillOpacity:1, strokeOpacity:1, duration:.4, ease:POP }, S(2,w));
  tl.to(dn[i].ring, { opacity:1, duration:.3 }, S(2,w)+.1);
});
tl.to(dn[6].ring, { attr:{ r:44 }, opacity:.0, duration:.7, ease:OUT }, S(2,"first")-.05);
exit("#s2", E(2,"first")+.05);

/* ---------- Captions: verbatim chunks of the script ---------- */
const CHUNKS = {
 1:["A person messages your ministry","on WhatsApp, Instagram, Telegram,","or another platform you already use."],
 2:["Our AI finds out where they are","on their spiritual journey,","so you can focus on the people","most open to the gospel first."],
 3:["It answers their questions","in your ministry's content and voice,","and when it's time,","it hands the conversation to a missionary."],
 4:["Already using Chatwoot or Turumba?","Our platform connects with both,","so your team keeps working","in the tools they know."],
 5:["Book a free demo call,","or make a donation,","at zogreo.org."]
};
const cap = document.getElementById("cap");
const tc = c => c.split(" ").reduce((a,t)=>a+(t.toLowerCase().startsWith("zogreo.org")?3:1),0);
const all = [];
for (let l=1; l<=5; l++) { const ws = WORDS.filter(w=>w.l===l); let i=0;
  CHUNKS[l].forEach(c => { const n=tc(c); all.push({ text:c, s:ws[i].s, e:ws[i+n-1].e }); i+=n; });
  if (i!==ws.length) throw new Error("caption/word mismatch on line "+l+": "+i+" vs "+ws.length); }
all.forEach((c,k)=>{ const d=document.createElement("div"); d.className="cap"; d.id="cap"+k; d.innerHTML="<span></span>"; d.firstChild.textContent=c.text; cap.appendChild(d);
  const nx = all[k+1]; let end = c.e+.12; if (nx && nx.s-c.e < .3) end = nx.s; 
  tl.fromTo("#cap"+k, { opacity:0, y:10 }, { opacity:1, y:0, duration:.14, ease:OUT }, c.s);
  tl.to("#cap"+k, { opacity:0, duration:.12 }, Math.max(c.s+.2, end-.12)); });
tl.set({}, {}, 33.03);
