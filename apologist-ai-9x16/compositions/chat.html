    #root { position: absolute; inset: 0; overflow: hidden; background: #111828; }
    #root * { box-sizing: border-box; }
    #ct-stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
    #ct-cam { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 540px 780px; }

    /* the ministry's agent bar */
    #ct-bar { position: absolute; left: 60px; top: 188px; width: 960px; height: 112px; }
    #ct-bar-bg, #ct-bar-flood { position: absolute; inset: 0; border-radius: 32px; }
    #ct-bar-bg { background: #18203A; box-shadow: inset 0 0 0 2px #232C47; }
    #ct-bar-flood { background: #1D1640; box-shadow: inset 0 0 0 2px #5A4FA6; clip-path: inset(0% 100% 0% 0%); }
    #ct-av { position: absolute; left: 24px; top: 20px; width: 72px; height: 72px; border-radius: 22px; background: #ECE7FB; color: #1D1640; font: 800 30px/72px "Inter PV"; text-align: center; letter-spacing: -0.02em; }
    #ct-name { position: absolute; left: 116px; top: 18px; font: 700 36px/42px "Inter PV"; color: #FFFFFF; white-space: nowrap; }
    #ct-sub { position: absolute; left: 116px; top: 62px; font: 500 28px/34px "Inter PV"; color: #A9A8C6; white-space: nowrap; }
    #ct-lang { position: absolute; left: 516px; top: 28px; width: 220px; height: 56px; border-radius: 28px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
    #ct-globe { position: absolute; left: 18px; top: 14px; width: 28px; height: 28px; }
    #ct-lang-vp { position: absolute; left: 56px; top: 0; width: 152px; height: 56px; overflow: hidden; }
    #ct-roll { position: absolute; left: 0; top: 0; width: 152px; }
    #ct-roll div { height: 56px; font: 600 28px/56px "Inter PV", "Noto Sans Arabic PV", "Noto Sans Devanagari PV"; color: #FFFFFF; white-space: nowrap; }
    #ct-clock { position: absolute; left: 752px; top: 28px; width: 184px; height: 56px; border-radius: 28px; background: rgba(255, 255, 255, 0.08); font: 600 28px/56px "Inter PV"; color: #FFFFFF; text-align: center; }
    #ct-clock-hi { position: absolute; inset: 0; border-radius: 28px; background: #A88BFF; color: #111828; font: 700 28px/56px "Inter PV"; text-align: center; }

    /* the conversation */
    #ct-vp { position: absolute; left: 60px; top: 330px; width: 960px; height: 840px; overflow: hidden; }
    #ct-empty { position: absolute; left: 0; top: 150px; width: 960px; text-align: center; }
    #ct-empty-av { width: 150px; height: 150px; margin: 0 auto; border-radius: 44px; background: #ECE7FB; color: #1D1640; font: 800 60px/150px "Inter PV"; letter-spacing: -0.02em; }
    #ct-empty-t { margin-top: 40px; font: 800 72px/80px "Inter PV"; letter-spacing: -0.03em; color: #FFFFFF; }
    #ct-empty-s { margin-top: 16px; font: 400 38px/48px "Inter PV"; color: #A9A8C6; }
    #ct-thread { position: absolute; left: 0; top: 0; width: 960px; height: 1400px; }
    .ct-bub { position: absolute; white-space: nowrap; }
    #ct-seek { right: 0; top: 40px; padding: 30px 40px; border-radius: 44px; border-bottom-right-radius: 14px; background: #2D2668; color: #FFFFFF; font: 500 46px/60px "Inter PV"; }
    #ct-deliv { position: absolute; right: 8px; top: 236px; font: 500 28px/32px "Inter PV"; color: #A9A8C6; white-space: nowrap; }
    .ct-who { position: absolute; left: 0; top: 280px; height: 60px; }
    .ct-who-av { position: absolute; left: 0; top: 0; width: 60px; height: 60px; }
    .ct-who-nm { position: absolute; left: 76px; top: 0; font: 600 30px/60px "Inter PV"; white-space: nowrap; }
    #ct-gen-who .ct-who-av { border-radius: 30px; background: #3A4258; }
    #ct-gen-who .ct-who-nm { color: #A9A8C6; }
    #ct-ans-who .ct-who-av { border-radius: 18px; background: #ECE7FB; color: #1D1640; font: 800 24px/60px "Inter PV"; text-align: center; }
    #ct-ans-who .ct-who-nm { color: #FFFFFF; }
    .ct-gb { left: 0; padding: 26px 34px; border-radius: 40px; border-top-left-radius: 12px; background: #E5E7EB; color: #374151; font: 400 42px/56px "Inter PV"; }

        tl.to(c.querySelector(".ct-q-c"), { autoAlpha: 0, duration: 0.12 }, t);
        tl.fromTo(c.querySelector(".ct-q-w"), { autoAlpha: 0, x: 18 }, { autoAlpha: 1, x: 0, duration: 0.24, ease: "power3.out" }, t + 0.06);
      });
      tl.to(["#ct-qvp", "#ct-team"], { autoAlpha: 0, filter: "blur(10px)", duration: 0.28, ease: "power3.in" }, T.qOut);

      // 4. generic AI answers: hedges, misquotes, contradicts
      tl.set("#ct-site", { autoAlpha: 0 }, T.qOut);
      tl.set("#ct-chatlayer", { autoAlpha: 1 }, T.qOut);
      tl.to("#ct-cam", { scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, T.qOut + 0.1);
      tl.fromTo("#ct-seek", { autoAlpha: 0, y: 60, scale: 0.9, transformOrigin: "100% 100%" }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.5, ease: "expo.out" }, T.qOut + 0.35);
      tl.fromTo("#ct-deliv", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.25 }, T.qOut + 0.8);
      ["#ct-gb1", "#ct-gb2", "#ct-gb3"].forEach((b, i) => tl.fromTo(b, { autoAlpha: 0, y: 60 }, { autoAlpha: 1, y: 0, duration: 0.45, ease: "expo.out" }, T.gen + 0.1 + i * 0.16));
      [["#ct-gb1", T.hedges], ["#ct-gb2", T.misquotes], ["#ct-gb3", T.contradicts]].forEach(([b, t]) => {
        tl.to(`${b} .ct-strike`, { scaleX: 1, duration: 0.26, ease: "power2.out", stagger: 0.08 }, t);
        tl.to(b, { color: "#7A7D93", duration: 0.26 }, t);
        tl.to(`${b} .ct-tag`, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(1.5)" }, t + 0.08);
      });

      // 5. Apologist AI: the generic answer leaves, the name arrives, the chat becomes the ministry's own
      tl.to(["#ct-gen-who", "#ct-gb1", "#ct-gb2", "#ct-gb3"], { autoAlpha: 0, filter: "blur(8px)", duration: 0.22, ease: "power2.in" }, T.genOut);
      tl.to("#ct-scrim", { opacity: 0.95, duration: 0.4, ease: "power2.inOut" }, T.genOut);
      tl.to("#ct-chatlayer", { autoAlpha: 0, duration: 0.15 }, T.genOut + 0.45);
      tl.set("#ct-logo", { autoAlpha: 1 }, T.logo);
      // under the scrim: back to the ministry's own website, ready for the widget
      tl.set("#ct-site", { autoAlpha: 1 }, T.logoOut + 0.15);
      tl.set(["#ct-name-g", "#ct-sub-g", "#ct-av-g", "#ct-seek", "#ct-deliv"], { autoAlpha: 0 }, T.logo);
      tl.set(["#ct-name", "#ct-sub", "#ct-av"], { autoAlpha: 1 }, T.logo);
      tl.set("#ct-chatlayer", { attr: { class: "light" } }, T.logo);
      tl.fromTo("#ct-logo", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.75, ease: "power2.inOut" }, T.logo);
      tl.fromTo("#ct-eyebrow", { autoAlpha: 0, filter: "blur(4px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3 }, T.eyebrow);
      tl.to(["#ct-logo", "#ct-eyebrow"], { autoAlpha: 0, scale: 0.94, filter: "blur(10px)", transformOrigin: "50% 50%", duration: 0.34, ease: "power3.in" }, T.logoOut);
      tl.to("#ct-scrim", { opacity: 0, duration: 0.45, ease: "power2.inOut" }, T.logoOut + 0.12);
      // the chatbot arrives on the same website: a launcher pops in, then the chat opens out of it with the question carried over
      tl.fromTo("#ct-launch", { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.42, ease: "back.out(1.6)" }, T.launch);
      tl.fromTo("#ct-launch-tip", { autoAlpha: 0, x: 40 }, { autoAlpha: 1, x: 0, duration: 0.35, ease: "expo.out" }, T.launch + 0.15);
      tl.to("#ct-launch", { scale: 0.92, duration: 0.08, ease: "power2.in" }, T.reskin - 0.08);
      tl.set(["#ct-seek", "#ct-deliv"], { autoAlpha: 1 }, T.reskin);
      tl.set("#ct-chatlayer", { autoAlpha: 1, clipPath: "circle(0px at 930px 1306px)" }, T.reskin);
      tl.to("#ct-chatlayer", { clipPath: "circle(2300px at 930px 1306px)", duration: 0.65, ease: "power2.inOut" }, T.reskin);
      tl.set("#ct-site", { autoAlpha: 0 }, T.reskin + 0.7);

      // 6. it answers from your own teaching, any hour, any language, with its sources
      tl.fromTo("#ct-ans-who", { autoAlpha: 0, y: 30 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "expo.out" }, T.typing);
      tl.fromTo("#ct-typing", { autoAlpha: 0, scale: 0.85, transformOrigin: "0% 0%" }, { autoAlpha: 1, scale: 1, duration: 0.25, ease: "power3.out" }, T.typing + 0.05);
      q("#ct-typing .ct-dot").forEach((d, i) => tl.fromTo(d, { y: 0 }, { y: -9, duration: 0.16, ease: "power1.inOut", yoyo: true, repeat: Math.max(1, Math.floor((T.reply - T.typing) / 0.32)) }, T.typing + 0.1 + i * 0.1));
      tl.to("#ct-typing", { autoAlpha: 0, duration: 0.12 }, T.reply);
      tl.fromTo("#ct-ans", { autoAlpha: 0, y: 50 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "expo.out" }, T.reply);
      q("#ct-ans .ct-w").forEach((w, i) => tl.to(w, { opacity: 1, duration: 0.08, ease: "none" }, T.reply + 0.1 + i * T.stream));
      tl.to("#ct-chip-src", { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" }, T.src);
      tl.fromTo("#ct-clock-hi", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2, ease: "power2.out" }, T.hour);
      tl.to("#ct-clock-hi", { autoAlpha: 0, duration: 0.3, ease: "power2.in" }, T.hour + 1.2);
      tl.to("#ct-roll", { y: -56 * 8, duration: 0.96, ease: "steps(8)" }, T.lang);
      tl.to("#ct-chip-ref", { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.4)" }, T.cites);

      // 7. when someone needs a real person, it passes them to your team
      tl.fromTo("#ct-hand", { autoAlpha: 0, y: 70 }, { autoAlpha: 1, y: 0, duration: 0.5, ease: "expo.out" }, T.hand);
      tl.to("#ct-thread", { y: -T.scrollHand, duration: 0.65, ease: "power2.inOut" }, T.hand + 0.05);
      tl.to("#ct-h-btn", { scale: 0.95, duration: 0.08, ease: "power2.in" }, T.press - 0.08);
      tl.to("#ct-h-btn", { scale: 1, backgroundColor: "#3A3375", duration: 0.2, ease: "power2.out" }, T.press);
      tl.to("#ct-h-ask", { autoAlpha: 0, duration: 0.15 }, T.connected - 0.12);
      tl.fromTo("#ct-h-done", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, T.connected);
      tl.fromTo(".ct-ha", { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.32, ease: "back.out(1.4)", stagger: 0.07 }, T.connected);

      // exit: cut the curve, leftward
      tl.to("#ct-stage", { x: -230, duration: 0.32, ease: "power4.in" }, T.exit);
      tl.to("#ct-stage", { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "none" }, T.exit);

      window.__timelines["chat"] = tl;
    })();
  </script>
</template>
