<template>
  <style>
    /*{{FONTS}}*/
    /*{{KIT}}*/
    #en-node { position: absolute; left: 430px; top: 260px; width: 220px; height: 220px; border-radius: 48px;
      background: linear-gradient(140deg, var(--purple), var(--deep)); box-shadow: 0 0 80px rgba(113, 55, 255, 0.45); }
    #en-node svg { position: absolute; left: 50px; top: 50px; }
    #en-name { position: absolute; left: 0; top: 500px; width: 1080px; text-align: center; font: 600 40px/1 "AP Outfit"; color: var(--ink); }
    #en-words { position: absolute; left: 110px; top: 640px; width: 900px; height: 300px; }
    .en-w { position: absolute; top: 0; background: var(--panel); border: 2px solid var(--line); color: var(--ink); }
    #en-q { position: absolute; left: 750px; top: 600px; font: 500 30px/1 "AP Inter"; color: var(--muted); }
    .en-c { position: absolute; left: 750px; font-size: 36px; border: 2px solid var(--line); background: var(--panel); color: var(--muted); }
    .en-bar { position: absolute; left: 905px; height: 14px; border-radius: 7px; background: var(--dim); }
    #en-tag { position: absolute; left: 0; width: 1080px; text-align: center; top: 940px; font: 600 30px/1 "AP Outfit"; letter-spacing: 0.1em; color: var(--amber); }
    #en-dial { position: absolute; left: 700px; top: 520px; width: 260px; height: 200px; }
    #en-dlab { position: absolute; left: 700px; top: 730px; width: 260px; text-align: center; font: 500 30px/1 "AP Inter"; color: var(--muted); }
    #en-frame { position: absolute; left: 100px; top: 200px; width: 880px; height: 700px; overflow: visible; }
    #en-flab { position: absolute; left: 134px; top: 226px; font: 600 44px/1 "AP Outfit"; color: var(--lilac); }
  </style>

  <div id="root" data-composition-id="engine" data-width="1080" data-height="1920">
    <div class="bg"></div>
    <div class="stage" id="en-stage">
      <div class="fit" style="transform: translate(-81px, 115px) scale(1.15)"><div class="cam" id="en-cam">
        <div id="en-node">
          <svg width="120" height="120" viewBox="0 0 120 120"><circle cx="30" cy="60" r="12" fill="#fff" /><circle cx="60" cy="60" r="12" fill="#fff" opacity="0.75" /><circle cx="90" cy="60" r="12" fill="#fff" opacity="0.5" /></svg>
        </div>
        <div id="en-name">AI model</div>
        <div id="en-words">
          <div class="chip en-w" style="left: 0px">For</div>
          <div class="chip en-w" style="left: 116px">God</div>
          <div class="chip en-w" style="left: 254px">so</div>
          <div class="chip en-w" style="left: 352px">loved</div>
          <div class="chip en-w" style="left: 506px; top: 0">the</div>
        </div>
        <div id="en-q">next word?</div>
        <div class="chip en-c" id="en-c0" style="top: 650px">world</div>
        <div class="chip en-c" id="en-c1" style="top: 740px">earth</div>
        <div class="chip en-c" id="en-c2" style="top: 830px">people</div>
        <div class="en-bar" id="en-b0" style="top: 676px; width: 56px"></div>
        <div class="en-bar" id="en-b1" style="top: 766px; width: 24px"></div>
        <div class="en-bar" id="en-b2" style="top: 856px; width: 12px"></div>
        <div id="en-tag">A GUESS THAT DRIFTED</div>
        <svg id="en-dial" viewBox="0 0 260 200">
          <path d="M30 170 A100 100 0 0 1 230 170" fill="none" stroke="#374151" stroke-width="18" stroke-linecap="round" />
          <path id="en-arc" d="M30 170 A100 100 0 0 1 230 170" fill="none" stroke="#B177FF" stroke-width="18" stroke-linecap="round" pathLength="100" stroke-dasharray="100 200" stroke-dashoffset="100" />
          <g id="en-needle" transform="rotate(-80 130 170)"><line x1="130" y1="170" x2="130" y2="92" stroke="#F9FAFB" stroke-width="8" stroke-linecap="round" /></g>
          <circle cx="130" cy="170" r="14" fill="#F9FAFB" />
        </svg>
        <div id="en-dlab">settings</div>
        <svg id="en-frame" viewBox="0 0 880 700">
          <rect id="en-rect" x="4" y="4" width="872" height="692" rx="56" fill="none" stroke="#7137FF" stroke-width="6" pathLength="100" stroke-dasharray="100 100" stroke-dashoffset="100" />
        </svg>
        <div id="en-flab">the method</div>
      </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      // entry: continues the leftward cut; the model node rides in with the stage
      tl.fromTo("#en-stage", { x: 230, opacity: 0.35, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, 0);
      gsap.set([".en-w", "#en-q", ".en-c", ".en-bar", "#en-tag", "#en-dial", "#en-dlab", "#en-flab"], { autoAlpha: 0 });
      // "writes by guessing likely words": words come out of the model one at a time
      tl.fromTo(".en-w", { autoAlpha: 0, y: -60, scale: 0.6 }, { autoAlpha: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(1.8)", stagger: T.wordStep }, T.writes);
      tl.to("#en-node", { scale: 1.06, duration: 0.18, yoyo: true, repeat: 7, ease: "sine.inOut" }, T.writes);
      // "likely words": the candidates for the next word, with their likelihood
      tl.to(["#en-q", ".en-c"], { autoAlpha: 1, duration: 0.25, stagger: 0.08 }, T.likely);
      tl.fromTo(".en-bar", { autoAlpha: 0, scaleX: 0, transformOrigin: "0% 50%" }, { autoAlpha: 1, scaleX: 1, duration: 0.4, stagger: 0.08, ease: "power2.out" }, T.likely + 0.1);
      // "every guess": the pick moves between candidates
      tl.to("#en-c0", { borderColor: "#B177FF", color: "#F9FAFB", duration: 0.15 }, T.guess);
      tl.to("#en-c0", { borderColor: "#374151", color: "#9CA3AF", duration: 0.15 }, T.guess + 0.35);
      tl.to("#en-c1", { borderColor: "#B177FF", color: "#F9FAFB", duration: 0.15 }, T.guess + 0.35);
      // "can drift": the guess lands on the wrong word
      tl.to("#en-c1", { borderColor: "#FBBF24", color: "#FBBF24", scale: 1.08, duration: 0.25, ease: "back.out(2)" }, T.drift);
      tl.to("#en-tag", { autoAlpha: 1, duration: 0.25 }, T.drift + 0.15);
      // "So the fix isn't...": the words clear, the model takes the centre
      tl.to([".en-w", "#en-q", ".en-c", ".en-bar", "#en-tag"], { autoAlpha: 0, y: 40, duration: 0.3, stagger: 0.02 }, T.fix);
      tl.to("#en-node", { x: -200, y: 230, duration: 0.5, ease: "power3.inOut" }, T.fix);
      tl.to("#en-name", { x: -200, y: 230, duration: 0.5, ease: "power3.inOut" }, T.fix);
      // "a smarter model": swap through unnamed models; nothing else changes
      ["Model B", "Model C", "AI model"].forEach((n, i) => {
        tl.to("#en-node", { scale: 0.86, duration: 0.12, ease: "power2.in" }, T.smarter + i * 0.32);
        tl.call(() => { document.getElementById("en-name").textContent = n; }, null, T.smarter + i * 0.32 + 0.12);
        tl.to("#en-node", { scale: 1, duration: 0.2, ease: "back.out(2)" }, T.smarter + i * 0.32 + 0.12);
      });
      tl.call(() => { document.getElementById("en-name").textContent = "AI model"; }, null, 0.01);
      // "new settings": a dial turns
      tl.to(["#en-dial", "#en-dlab"], { autoAlpha: 1, duration: 0.25 }, T.settings - 0.2);
      tl.to("#en-arc", { strokeDashoffset: 50, duration: 0.7, ease: "power2.inOut" }, T.settings);
      tl.fromTo("#en-needle", { rotation: -80, svgOrigin: "130 170" }, { rotation: 0, svgOrigin: "130 170", duration: 0.7, ease: "power2.inOut" }, T.settings);
      // "It's the method": a frame draws around both; the method is what wraps the model
      tl.to("#en-rect", { strokeDashoffset: 0, duration: 0.55, ease: "power2.inOut" }, T.method - 0.5);
      tl.to("#en-flab", { autoAlpha: 1, duration: 0.25 }, T.method);
      tl.to(["#en-node", "#en-dial"], { opacity: 0.55, duration: 0.4 }, T.method + 0.1);
      tl.fromTo("#en-cam", { scale: 1 }, { scale: 1.02, duration: T.exit, ease: "sine.inOut" }, 0);
      tl.to("#en-stage", { x: -230, duration: 0.32, ease: "power4.in" }, T.exit);
      tl.to("#en-stage", { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "none" }, T.exit);
      window.__timelines["engine"] = tl;
    })();
  </script>
</template>
