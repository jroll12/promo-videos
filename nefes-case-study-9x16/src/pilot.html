  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });
      const CAM = -740; // how far the camera travels down the path

      // entry: cut the curve, still travelling left. The label, the headline and the team ride in with the stage.
      tl.fromTo("#pl-stage", { x: 230, opacity: 0.35, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, 0);

      gsap.set(".pl-fill", { scale: 0, transformOrigin: "50% 50%" });
      gsap.set(".pl-chk", { autoAlpha: 0 });
      gsap.set(".pl-row span", { opacity: 0.45 });

      // 1 · "So at Zogreo, we ran a pilot": what was built. The camera eases in on the words.
      tl.fromTo("#pl-head", { scale: 1 }, { scale: 1.05, duration: T.travel - 0.34, ease: "sine.inOut" }, 0.34);

      // 2 · "Our AI leads each person through three Bible studies": the camera travels down the path
      tl.to(["#pl-head", "#pl-sub"], { autoAlpha: 0, filter: "blur(8px)", duration: 0.3, ease: "power1.in" }, T.travel + 0.04);
      tl.to("#pl-world", { y: CAM, duration: T.travelDur, ease: "power3.inOut" }, T.travel);
      tl.to(".pl-seg", { strokeDashoffset: 0, duration: 0.45, ease: "power2.out", stagger: 0.16 }, T.travel + 0.3);
      [T.c1, T.c2, T.c3].forEach((t, k) => {
        tl.fromTo("#pl-c" + (k + 1), { autoAlpha: 0, y: 84 }, { autoAlpha: 1, y: 0, duration: 0.32, ease: "power4.out" }, t);
        tl.fromTo("#pl-n" + (k + 1), { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, t + 0.05);
      });
      tl.fromTo("#pl-n4", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.2 }, T.c3 + 0.25);
      // one person on the path, study by study, on "three Bible studies"
      tl.fromTo("#pl-dot", { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.24, ease: "back.out(1.7)" }, T.dotIn);
      [[T.n1, 80, T.dotIn + 0.26], [T.n2, 310, T.n1], [T.n3, 540, T.n2]].forEach(([at, y, prev], k) => {
        const d = Math.min(0.32, at - prev - 0.02);
        tl.to("#pl-dot", { y, duration: d, ease: "power2.inOut" }, at - d);
        tl.to("#pl-n" + (k + 1) + " .pl-nc", { fill: "#F7F4EC", duration: 0.16 }, at);
        tl.fromTo("#pl-c" + (k + 1) + " .pl-num", { opacity: 0.13 }, { opacity: 0.34, duration: 0.2 }, at);
      });
      // "answers their questions, and follows up": each study, ticked
      const tick = (row, t) => {
        [1, 2, 3].forEach((k, i) => {
          const sel = "#pl-c" + k + " " + row;
          tl.to(sel + " .pl-fill", { scale: 1, duration: 0.24, ease: "back.out(1.7)" }, t + i * 0.12);
          tl.to(sel + " .pl-chk", { autoAlpha: 1, duration: 0.12 }, t + i * 0.12 + 0.08);
          tl.to(sel + " span", { opacity: 1, duration: 0.2 }, t + i * 0.12);
        });
      };
      tick(".pl-ra", T.answers);
      tick(".pl-rb", T.follows);

      // 3 · "Those who finish, and obey in faith": through all three, to the end of the path
      tl.fromTo(".pl-card", { boxShadow: "inset 0 0 0 0px #5DA95F" }, { boxShadow: "inset 0 0 0 6px #5DA95F", duration: 0.26, ease: "power2.out", stagger: 0.09 }, T.finish);
      tl.to("#pl-dot", { y: 710, duration: 0.42, ease: "power2.inOut" }, T.finish + 0.1);
      tl.to("#pl-n4 .pl-nc", { fill: "#F7F4EC", duration: 0.16 }, T.finish + 0.52);
      tl.fromTo("#pl-end", { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.26, ease: "power2.out" }, T.obey);

      // 4 · a breath of stillness, then the hand-off: "are handed to the team on the ground"
      tl.to("#pl-dot", { x: 88, y: 900, duration: T.impact - T.handed, ease: "power3.in" }, T.handed);
      tl.to("#pl-dot", { autoAlpha: 0, duration: 0.08 }, T.impact);
      tl.fromTo("#pl-chip", { scale: 1, transformOrigin: "50% 50%" }, { scale: 1.09, duration: 0.5, ease: "back.out(1.8)" }, T.impact);
      tl.fromTo("#pl-handed", { autoAlpha: 0, filter: "blur(6px)", y: 10 }, { autoAlpha: 1, filter: "blur(0px)", y: 0, duration: 0.3, ease: "power2.out" }, T.impact + 0.1);
      // the camera keeps moving in on the team the whole way down the path (no dead hold while the studies tick), then settles on the hand-off
      tl.fromTo("#pl-push", { scale: 1 }, { scale: 1.06, duration: T.impact - T.travel - T.travelDur, ease: "sine.inOut" }, T.travel + T.travelDur);
      tl.to("#pl-push", { scale: 1.09, duration: T.exit - T.impact, ease: "sine.out" }, T.impact);

      // exit: cut the curve, upward (the result rises)
      tl.to("#pl-stage", { y: -230, duration: 0.32, ease: "power4.in" }, T.exit);
      tl.to("#pl-stage", { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "none" }, T.exit);

      window.__timelines["pilot"] = tl;
    })();
  </script>
