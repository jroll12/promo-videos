  <script>
    (function () {
      const T = {"many":1.44,"hostile":3.18,"take":4.71,"pilot":5.95,"our":6.85,"took":7.25,"answered":8.59,"pass":9.39,"stats":6.3,"quoteIn":10.33,"attr":10.63,"qwords":[12.28,12.46,12.75,13.04,13.23,13.52,13.81,14.47,14.66,15.16,15.88,16.1,16.28,16.5,16.68,17.05,17.34,17.63,17.81,18.03,18.46,18.75,18.97,19.26],"exit":20.55};
      const tl = gsap.timeline({ paused: true });
      const H = Array.from(document.querySelectorAll("#rf-art .rf-h"));
      const S = Array.from(document.querySelectorAll("#rf-art .rf-s"));
      const num = (el, k) => parseFloat(el.dataset[k]);
      const C = { x: 540, y: 760 };

      // entry: cut the curve, still travelling left. The team and the first messages ride in with the stage.
      tl.fromTo("#rf-stage", { x: 230, opacity: 0.35, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, 0);
      gsap.set(["#rf-tag", "#rf-glow", "#rf-stats", "#rf-mark", "#rf-quote", "#rf-attr", ".rf-rep", ".rf-hs"], { autoAlpha: 0 });
      gsap.set("#rf-quote .w", { opacity: 0.24 });
      const early = [6, 7]; // two of the messages are already near when the scene opens
      H.forEach((h, i) => gsap.set(h, early.includes(i) ? { x: num(h, "x"), y: num(h, "y") } : { x: num(h, "fx"), y: num(h, "fy") }));
      S.forEach((s) => gsap.set(s, { x: num(s, "x"), y: num(s, "y") }));
      tl.fromTo("#rf-push", { scale: 1 }, { scale: 1.04, duration: T.quoteIn - 0.4, ease: "sine.inOut" }, 0.4);

      // 1 · "Many who answer these ads": messages come in from every side
      H.forEach((h, i) => {
        if (early.includes(i)) return;
        tl.to(h, { x: num(h, "x"), y: num(h, "y"), duration: 0.8, ease: "power3.out" }, T.many + i * 0.06);
      });
      // "are hostile": most of them turn. The jagged shape, not a colour, marks them.
      H.forEach((h, i) => {
        const t = T.hostile + i * 0.045;
        tl.to(h.querySelector(".rf-hr"), { autoAlpha: 0, duration: 0.1 }, t);
        tl.fromTo(h.querySelector(".rf-hs"), { autoAlpha: 0, scale: 0.6, rotation: i % 2 ? -14 : 14, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, rotation: 0, duration: 0.3, ease: "back.out(1.7)" }, t);
      });

      // 2 · "and responders take the abuse": three reach the team, and the team recoils
      const hits = [[1, 250, 772, 14, 0], [4, 830, 772, -14, 0], [6, 356, 668, 6, 10]];
      hits.forEach(([i, hx, hy, rx, ry], k) => {
        const t = T.take + k * 0.36;
        tl.to(H[i], { x: hx, y: hy, duration: 0.2, ease: "power3.in" }, t);
        tl.to("#rf-chip", { x: rx, y: ry, duration: 0.08, ease: "power2.out" }, t + 0.2);
        tl.to("#rf-chip", { x: 0, y: 0, duration: 0.26, ease: "power2.out" }, t + 0.28);
      });

      // 3 · "In the pilot, our AI took it instead": a line closes around the team, and the hostile messages stop at it
      tl.to("#rf-shield", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, T.pilot);
      tl.fromTo("#rf-glow", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.4 }, T.pilot + 0.5);
      hits.forEach(([i], k) => {
        tl.to(H[i], { x: num(H[i], "x"), y: num(H[i], "y"), duration: 0.42, ease: "power3.out" }, T.pilot + 0.22 + k * 0.08);
      });
      tl.fromTo("#rf-tag", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.our);
      H.forEach((h, i) => {
        const x = num(h, "x"), y = num(h, "y"), a = Math.atan2(C.y - y, C.x - x), t = T.took + i * 0.05;
        tl.to(h, { x: x + Math.cos(a) * 22, y: y + Math.sin(a) * 22, duration: 0.12, ease: "power2.in" }, t);
        tl.to(h, { x, y, duration: 0.3, ease: "power3.out" }, t + 0.12);
      });
      // "and answered graciously": every one of them gets a reply
      tl.fromTo(".rf-rep", { autoAlpha: 0, scale: 0.4, transformOrigin: "50% 50%" }, { autoAlpha: 1, scale: 1, duration: 0.3, ease: "back.out(1.6)", stagger: 0.07 }, T.answered);
      // only the sincere ones come through to a person
      S.forEach((s, i) => {
        tl.to(s, { x: num(s, "dx"), y: num(s, "dy"), duration: 0.62, ease: "power2.inOut" }, T.pass + i * 0.14);
      });

      // the published numbers count up underneath
      const fmt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      const n = { a: 0, b: 0 };
      const n1 = document.getElementById("rf-n1"), n2 = document.getElementById("rf-n2");
      const show = () => { n1.textContent = fmt(n.a); n2.textContent = fmt(n.b); };
      tl.fromTo("#rf-stats", { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.35, ease: "power3.out" }, T.stats);
      tl.to(n, { a: 25938, duration: 1.5, ease: "power2.out", onUpdate: show }, T.stats + 0.1);
      tl.to(n, { b: 356, duration: 1.2, ease: "power2.out", onUpdate: show }, T.stats + 0.3);
      tl.fromTo("#rf-n3", { scale: 0.6 }, { scale: 1, duration: 0.4, ease: "back.out(1.8)" }, T.took + 0.2);

      // 4 · "In the responder's words": the picture steps back and the words take the frame, lighting as they are spoken
      tl.to("#rf-dia", { autoAlpha: 0, scale: 0.94, filter: "blur(8px)", duration: 0.4, ease: "power2.in" }, T.quoteIn);
      tl.fromTo(["#rf-mark", "#rf-quote"], { autoAlpha: 0, filter: "blur(8px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.36, ease: "power2.out" }, T.quoteIn + 0.2);
      tl.fromTo("#rf-attr", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.attr);
      document.querySelectorAll("#rf-quote .w").forEach((w, i) => {
        tl.to(w, { opacity: 1, duration: 0.18, ease: "power2.out" }, T.qwords[i]);
      });
      tl.fromTo("#rf-quote", { scale: 1 }, { scale: 1.05, duration: T.exit - T.quoteIn - 0.6, ease: "sine.inOut" }, T.quoteIn + 0.6);

      // exit: cut the curve, upward
      tl.to("#rf-stage", { y: -230, duration: 0.32, ease: "power4.in" }, T.exit);
      tl.to("#rf-stage", { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "none" }, T.exit);

      window.__timelines["relief"] = tl;
    })();
  </script>
