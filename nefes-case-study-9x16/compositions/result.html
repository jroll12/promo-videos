  <script>
    (function () {
      const T = {"count0":1.67,"num":2.87,"cap":1.82,"nudge":5.61,"leaders":6.06,"foot":6.51,"same":8.34,"exit":10.01};
      const tl = gsap.timeline({ paused: true });

      // entry: cut the curve, still rising. The label, both rows of dots and the number arrive with the stage.
      tl.fromTo("#rs-stage", { y: 230, opacity: 0.35, filter: "blur(8px)" }, { y: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, 0);
      gsap.set(["#rs-cap", "#rs-small", "#rs-ld1", "#rs-ld2", "#rs-l1", "#rs-l2", "#rs-foot"], { autoAlpha: 0 });
      gsap.set(".rs-bar", { scaleX: 0 });

      // 1 · "the same team could serve 3.73 times as many people": the dots fill as the number counts, and both land on the spoken number
      const dots = Array.from(document.querySelectorAll("#rs-b .rs-db"));
      const num = document.getElementById("rs-num");
      const n = { v: 1 };
      const show = () => {
        num.textContent = n.v.toFixed(2) + "×";
        const c = n.v * 100;
        for (let i = 100; i < dots.length; i++) dots[i].style.opacity = String(0.12 + 0.88 * Math.min(1, Math.max(0, c - i)));
      };
      show();
      tl.to(n, { v: 3.73, duration: T.num + 0.05 - T.count0, ease: "power2.inOut", onUpdate: show }, T.count0);
      tl.fromTo("#rs-cap", { autoAlpha: 0, filter: "blur(4px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, T.cap);
      tl.fromTo("#rs-push", { scale: 1 }, { scale: 1.07, duration: T.exit - 0.4, ease: "sine.inOut" }, 0.4);

      // 2 · "And they found disciple-making leaders at about the same rate": the number steps up to make room
      tl.to(["#rs-rows", "#rs-cap"], { y: -90, autoAlpha: 0, filter: "blur(8px)", duration: 0.3, ease: "power2.in" }, T.nudge);
      tl.to("#rs-num", { y: -665, scale: 0.5, duration: 0.66, ease: "power3.inOut" }, T.nudge + 0.04);
      tl.fromTo("#rs-small", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.nudge + 0.6);
      tl.fromTo("#rs-ld1", { autoAlpha: 0, y: 64 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power4.out" }, T.leaders);
      tl.fromTo("#rs-ld2", { autoAlpha: 0, y: 64 }, { autoAlpha: 1, y: 0, duration: 0.3, ease: "power4.out" }, T.leaders + 0.14);
      tl.fromTo("#rs-foot", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.foot);
      // two equal bars: a picture of "about the same" (the case study publishes no counts)
      tl.fromTo(["#rs-l1", "#rs-l2"], { autoAlpha: 0, x: -16 }, { autoAlpha: 1, x: 0, duration: 0.26, ease: "power3.out", stagger: 0.08 }, T.same - 0.3);
      tl.to(".rs-bar", { scaleX: 1, duration: 0.62, ease: "power3.out" }, T.same);

      // exit: cut the curve, leftward
      tl.to("#rs-stage", { x: -230, duration: 0.32, ease: "power4.in" }, T.exit);
      tl.to("#rs-stage", { opacity: 0, filter: "blur(8px)", duration: 0.28, ease: "none" }, T.exit);

      window.__timelines["result"] = tl;
