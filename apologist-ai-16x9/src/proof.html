  <script>
    (function () {
      const T = /*{{T}}*/ {};
      const tl = gsap.timeline({ paused: true });

      // entry: cut the curve, still travelling left; the night gives way to daylight as the stage arrives
      tl.fromTo("#pf-stage", { x: 230, opacity: 0.35, filter: "blur(8px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.34, ease: "power4.out" }, 0);

      gsap.set(["#pf-num", "#pf-label", "#pf-method", "#pf-source"], { autoAlpha: 0 });
      gsap.set(["#pf-band", ".pf-stat", "#pf-rule", "#pf-tb"], { autoAlpha: 0 });
      gsap.set(".pf-nm", { opacity: 0.18 });

      // the number one: a breath, then the numeral lands on "one"

      tl.fromTo("#pf-method", { autoAlpha: 0, filter: "blur(6px)" }, { autoAlpha: 1, filter: "blur(0px)", duration: 0.3, ease: "power2.out" }, T.method);
      tl.fromTo("#pf-source", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, T.source);

      // trusted by: the band rises over the claim, the numbers count up, the names ink in order as they are spoken

      // once the band covers the frame, the ground beneath matches it, so the exit fades indigo on indigo
      tl.to("#pf-bg", { backgroundColor: "#1D1640", duration: 0.2, ease: "none" }, T.band + 0.75);
      const counts = [[0, 2.5, (v) => v.toFixed(1) + "M+"], [1, 600, (v) => Math.round(v) + "K+"], [2, 205, (v) => Math.round(v) + "+"], [3, 192, (v) => String(Math.round(v))], [4, 19, (v) => String(Math.round(v))]];

        const el = document.getElementById("pf-n" + i);
        const o = { v: 0 };
        tl.to(o, { v: end, duration: 0.9, ease: "power2.out", onUpdate: () => { el.textContent = fmt(o.v); } }, T.band + 0.3 + i * 0.1);
